# Robovac control UI, for a Valetudo-enabled vacuum.
#
# Ingress is handled by Tailscale on the host, not by a reverse proxy here:
#   tailscale serve --bg --https=443 http://127.0.0.1:8080
#
# The vacuum is expected at VALETUDO_URL and stays on the LAN. Only this stack
# needs to be reachable from your tailnet.
#
# MQTT is deliberately not included. Nothing here consumes it: robovac polls
# Valetudo over HTTP and pushes updates to the browser with SSE. A broker is
# only needed later for maploader (multi-floor maps) or Home Assistant
# autodiscovery, so it lives in docker-compose.mqtt.yml as an opt-in overlay:
#
#   docker compose -f docker-compose.yml -f docker-compose.mqtt.yml up -d --build

name: robovac

services:
  robovac:
    build:
      context: ./robovac
    image: robovac:latest
    container_name: robovac
    restart: unless-stopped
    # Host networking keeps the LAN address of the vacuum reachable without
    # extra NAT, and lets `tailscale serve` target 127.0.0.1 directly.
    # Linux only; ignored on Docker Desktop.
    network_mode: host
    environment:
      # The one required value: the vacuum's address on your LAN.
      VALETUDO_URL: ${VALETUDO_URL:?set VALETUDO_URL to the robot's LAN address, e.g. http://192.0.2.46}
      # Valetudo's own basic auth, if you enabled webserver.basicAuth.enabled.
      VALETUDO_USERNAME: ${VALETUDO_USERNAME:-}
      VALETUDO_PASSWORD: ${VALETUDO_PASSWORD:-}
      # A second auth layer in front of this UI. Set both or neither; robovac
      # refuses to start if only one is present.
      WEB_USERNAME: ${WEB_USERNAME:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      BIND: ${BIND:-0.0.0.0:8080}
      RUST_LOG: ${RUST_LOG:-info,robovac=debug}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-2000}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL