# Variant of ../docker-compose.yml that pulls the published image instead of
# building from source. Use this if your server would rather not compile Rust.
#
# Before using it, make the GHCR package public, otherwise the pull returns 401:
#   https://github.com/users/bravesfan133/packages/container/package/robovac
#     -> Package settings -> Change visibility -> Public
#
# Requires the image to have been published by CI:
#   https://github.com/bravesfan133/robovac/actions

name: robovac

services:
  robovac:
    image: ghcr.io/bravesfan133/robovac:main
    container_name: robovac
    restart: unless-stopped
    # Host networking keeps the LAN address of the vacuum reachable without
    # extra NAT, and lets `tailscale serve` target 127.0.0.1 directly.
    # Linux only: Docker Desktop ignores this.
    network_mode: host
    environment:
      VALETUDO_URL: ${VALETUDO_URL:?set VALETUDO_URL, e.g. http://192.0.2.46}
      VALETUDO_USERNAME: ${VALETUDO_USERNAME:-}
      VALETUDO_PASSWORD: ${VALETUDO_PASSWORD:-}
      WEB_USERNAME: ${WEB_USERNAME:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      BIND: ${BIND:-0.0.0.0:8080}
      RUST_LOG: ${RUST_LOG:-info,robovac=debug}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-2000}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: robovac-mosquitto
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_BIND:?set MOSQUITTO_BIND to your host LAN address, e.g. 192.0.2.1:1883}:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  mosquitto-data:
  mosquitto-log: