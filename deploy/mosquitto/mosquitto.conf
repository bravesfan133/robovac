# Minimal broker config for Valetudo.
#
# Valetudo connects as an MQTT client and publishes Home Assistant autodiscovery
# payloads. Anonymous access is acceptable on an isolated LAN, but if you expose
# this port beyond the LAN, put a password file in place and set
# `allow_anonymous false` plus per-user ACLs.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous true

# Uncomment once you have created /mosquitto/config/passwd (mosquitto_passwd -c).
# allow_anonymous false
# password_file /mosquitto/config/passwd
