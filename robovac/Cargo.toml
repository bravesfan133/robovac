[package]
name = "robovac"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Minimal, self-hosted control UI for a Valetudo-enabled robot vacuum"
license = "MIT"

[dependencies]
askama = "0.14"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "trace"] }
tracing = "0.1"
url = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"